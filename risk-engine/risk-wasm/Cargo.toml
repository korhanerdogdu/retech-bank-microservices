[package]
name = "risk-wasm"
description = "WebAssembly bindings of risk-core for the Risk Simulation Dashboard (simulation only)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
risk-core.workspace = true
serde.workspace = true
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[package.metadata.wasm-pack.profile.release]
# Skip the binaryen download so builds work offline / behind proxies.
wasm-opt = false
