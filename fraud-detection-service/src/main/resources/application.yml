spring:
  application:
    name: fraud-detection-service
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: fraud-detection-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring:
          deserializer:
            value:
              delegate:
                class: org.springframework.kafka.support.serializer.JsonDeserializer
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: java.util.HashMap
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  cloud:
    openfeign:
      client:
        config:
          account-service:
            connect-timeout: 5000
            read-timeout: 10000
          risk-engine:
            connect-timeout: 1000
            read-timeout: 2000

server:
  port: 8084

# Account Service URL for Feign Client (fallback balance lookup)
account:
  service:
    url: http://localhost:8081

# Rust Fraud Risk Engine — makes the decisions; the Java rules below are the fallback
risk:
  engine:
    enabled: true
    url: http://localhost:8086
    fallback-to-local: true

# Fraud Detection Rules — keep in sync with the risk-engine RISK_* environment variables
fraud:
  max-transactions-per-minute: 5
  suspicious-amount-multiplier: 3.0
  max-balance-percentage: 0.90
  block-velocity-multiplier: 2
  block-min-triggered-rules: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
